<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Currículo LukasHeldt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">

    <aside class="lateral">
      <img id="foto" class="foto" alt="Foto de perfil">

      <section>
        <h2>Contato</h2>
        <ul class="contatos" id="contatos"></ul>
      </section>

      <section id="sec-formacao">
        <h2>Formação acadêmica</h2>
        <div id="formacao"></div>
      </section>

      <section>
        <h2>Idiomas</h2>
        <ul class="lista" id="idiomas"></ul>
      </section>

      <section>
        <h2>Informações adicionais</h2>
        <ul class="lista" id="adicionais"></ul>
      </section>
    </aside>

    <main class="principal">

      <header class="topo">
        <h1 id="nome"></h1>
        <p class="cargo" id="cargo"></p>
      </header>

      <section id="sec-resumo">
        <h2>Resumo profissional</h2>
        <p id="resumo"></p>
      </section>

      <section id="sec-experiencia">
        <h2>Experiência profissional</h2>
        <div id="experiencia"></div>
      </section>

      <section id="sec-projetos">
        <h2>Projetos</h2>
        <div id="projetos"></div>
      </section>

      <div class="colunas">
        <section>
          <h2>Habilidades técnicas</h2>
          <ul class="lista" id="tecnicas"></ul>

          <h2>Ferramentas</h2>
          <ul class="lista" id="ferramentas"></ul>
        </section>

        <section>
          <h2>Habilidades comportamentais</h2>
          <ul class="lista" id="comportamentais"></ul>
        </section>
      </div>

    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
